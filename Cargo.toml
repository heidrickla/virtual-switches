[package]
name = "vswitch"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
flate2 = "1.1.10"
ratatui = "0.30.2"
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode-perl"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"

[dev-dependencies]
portable-pty = "0.9.0"
vt100 = "0.16.2"

[target.'cfg(windows)'.dev-dependencies]
crossterm_winapi = "0.9.1"

# The forge's test build (`cargo nextest run --cargo-profile ci-test`): the crate at opt-level 1 runs
# the suite in about 70% of the time for about 28 s more build, measured on four CPUs; line tables
# keep a backtrace's files and lines
[profile.ci-test]
inherits = "dev"
debug = "line-tables-only"

[profile.ci-test.package.vswitch]
opt-level = 1
