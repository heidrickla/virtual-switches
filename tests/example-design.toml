# Proxmox Backup Server
[[port_channel]]
id = 30
description = "pve-pbs"
allowed = "450,456"
edge = true
members = [
  { port = "Twe1/0/13", description = "pve-pbs" },
  { port = "Twe2/0/13", description = "pve-pbs" },
]

# core trunk to core-a Po40 (Te2/0/3-4 on its C9400-LC-24XS), 10G optics (SFP-10G-SR) in the SFP28 ports
[[port_channel]]
id = 40
description = "core trunk to core-a Po40"
allowed = "except 451-453,456,459"
members = [
  { port = "Twe1/0/24", description = "core-a Te2/0/3" },
  { port = "Twe2/0/24", description = "core-a Te2/0/4" },
]

# 100G inter-site link to the MDF SN2410M pair (MLAG Mpo3), QSFP-100G-LR4-S
[[port_channel]]
id = 100
description = "MDF SN2410M pair Mpo3"
allowed = "451,452,456,459"
members = [
  { port = "Hu1/1/1", description = "HP-SN2410M-SW-A Eth1/49" },
  { port = "Hu2/1/1", description = "HP-SN2410M-SW-B Eth1/49" },
]

[change]
title = "dc1-stack-sw01: initial configuration of the Proxmox top-of-rack stack (2 x C9300X-24Y with C9300X-NM-4C, IOS-XE 17.15)"
steps = [
  "New switches: there is no running configuration to start from.",
  "Both members on IOS-XE 17.15.2 or later in install mode, stacked with both StackWise cables (full ring) and StackPower.",
  "Twe1/0/24 and Twe2/0/24 (Po40 to core-a) and Hu1/1/1 and Hu2/1/1 (Po100 to MDF) stay unplugged until the checks after pass.",
]
before = [
  "show version   (17.15.2 or later, INSTALL mode)",
  "show switch   (members 1 and 2 Ready)",
]
after = [
  "show vtp status   (VTP Operating Mode Transparent)",
  "show vlan brief   (65-68, 410-412, 450-452, 456, 459, 460, 499, 520, 530, 535, 540, 545, 550, 555, 900, 901)",
  "show etherchannel summary   (Po11-15, Po21-25, Po30, Po40, Po100; each SU once its far end is up)",
  "show interfaces trunk   (Po40: native 499, allowed 1-450,454,455,457,458,460-4094; Po100: allowed 451,452,456,459)",
  "show spanning-tree root   (once Po40 is up: the root port is Po40 for the cores' VLANs)",
]
rollback_note = "isolates the stack from the core and MDF; the host links stay up"
rollback = [
  "interface Port-channel40",
  " shutdown",
  "interface Port-channel100",
  " shutdown",
]
