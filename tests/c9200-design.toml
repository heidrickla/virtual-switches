# A Catalyst 9200 access stack for tests: two C9200-48T with C9200-NM-4X, a 10G uplink across both
# members, and access ports.

hostname = "idf-9200"
stack = ["C9200-48T+C9200-NM-4X", "C9200-48T+C9200-NM-4X"]
vtp_mode = "transparent"
spanning_tree = { mode = "rapid-pvst", priority = 61440, vlans = "1-4094" }
domain = "lab.example"
management = { address = "10.0.0.20", mask = "255.255.255.0", gateway = "10.0.0.1" }
ssh_only = true
native_vlan = 999

vlan = [
  { id = 10, name = "Users" },
  { id = 20, name = "Phones" },
  { id = 999, name = "Native" },
]

[[port_channel]]
id = 1
description = "uplink to the core"
allowed = "10,20,999"
lacp_fast = true
members = [
  { port = "Te1/1/1", description = "core Te1/0/1" },
  { port = "Te2/1/1", description = "core Te2/0/1" },
]

[[access]]
port = "Gi1/0/1"
vlan = 10
description = "desk 1"
edge = true

[[access]]
port = "Gi2/0/48"
vlan = 20
description = "phone 48"
edge = true
