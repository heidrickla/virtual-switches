# A Catalyst 9300L and 9300LM stack for tests: a C9300L-48T-4X and a C9300LM-48T-4Y, a port-channel on
# each member's built-in uplinks, and access ports.

hostname = "idf-9300l"
stack = ["C9300L-48T-4X", "C9300LM-48T-4Y"]
vtp_mode = "transparent"
spanning_tree = { mode = "rapid-pvst", priority = 61440, vlans = "1-4094" }
domain = "lab.example"
management = { address = "10.0.0.40", mask = "255.255.255.0", gateway = "10.0.0.1" }
ssh_only = true
native_vlan = 999

vlan = [
  { id = 10, name = "Users" },
  { id = 999, name = "Native" },
]

[[port_channel]]
id = 1
description = "uplink to the core"
allowed = "10,999"
lacp_fast = true
members = [
  { port = "Te1/1/1", description = "core Te1/0/1" },
  { port = "Te1/1/2", description = "core Te2/0/1" },
]

[[port_channel]]
id = 2
description = "second uplink"
allowed = "10,999"
members = [
  { port = "Twe2/1/1", description = "core Twe1/0/1" },
  { port = "Twe2/1/2", description = "core Twe2/0/1" },
]

[[access]]
port = "Gi1/0/1"
vlan = 10
description = "desk 1"
edge = true

[[access]]
port = "Gi2/0/48"
vlan = 10
description = "desk 48"
edge = true
